# --- DB DEMO (Render/Neon/Supabase) ---
spring.datasource.url=${DB_URL:${DATABASE_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=require}}
spring.datasource.username=${DB_USERNAME:${DB_USER}}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / SQL init ---
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=update
logging.level.org.springframework=INFO

# --- URLs + upload ---
app.baseUrl=${APP_BASE_URL}
app.frontendUrl=${APP_FRONTEND_URL}
app.upload-dir=${APP_UPLOAD_DIR:/tmp/jlh-upload}
app.images.base-url=${APP_IMAGES_BASE_URL:${app.baseUrl}/promotions/images/}
app.files.base-url=${APP_FILES_BASE_URL:${app.baseUrl}}

# --- Mail (désactivé par défaut en démo) ---
app.email.enabled=${APP_EMAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
