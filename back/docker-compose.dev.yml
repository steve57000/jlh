services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-jlh_autopam}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-jlh_autopam}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - jlh-dev

  # ---- MailHog (SMTP de dev) ----
  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # UI Web http://localhost:8025
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8025 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - jlh-dev

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev

      # ---- DB (dev) ----
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-jlh_autopam}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-jlh_autopam}?sslmode=disable

      # ---- SMTP (MailHog) ----
      MAIL_HOST: mailhog
      MAIL_PORT: 1025

    volumes:
      # si ton build runtime exécute le jar, ne monte PAS src/pom.xml (sinon ça sert à rien)
      - ./uploads:/var/www/promo
      - m2-repo:/root/.m2/repository

    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_healthy
    networks:
      - jlh-dev

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./uploads:/var/www/promo:ro
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend
    networks:
      - jlh-dev

networks:
  jlh-dev:

volumes:
  postgres-data:
  m2-repo:
