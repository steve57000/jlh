upstream jlh_backend {
    server backend:8080;
}

server {
    listen 80;
    server_name api.jlh-autopam.fr;

    # ✅ Fix 413 (upload)
    client_max_body_size 20m;

    location /uploads/ {
        alias /var/www/promo/;
        autoindex off;
        expires 1d;
        add_header Cache-Control "public";
    }

    location /promotions/images/ {
        alias /var/www/promo/images/;
        autoindex off;
        expires 1d;
        add_header Cache-Control "public";
    }

    location /icons/ {
        alias /var/www/promo/icons/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://jlh_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # (optionnel mais bien) timeouts si upload/traitement long
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
